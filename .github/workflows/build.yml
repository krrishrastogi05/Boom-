name: Build PairPulse Windows Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cd pairpulse/client
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_TLS=1 -DUSE_OPEN_SSL=1 -DUSE_MBED_TLS=0 -DUSE_ZLIB=0

    - name: Build pairpulse.exe
      run: |
        cd pairpulse/client
        cmake --build build --config Release
        Get-ChildItem -Path "C:\Program Files\OpenSSL" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination build/Release/ -Force -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload pairpulse.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pairpulse-windows-x64
        path: |
          pairpulse/client/build/Release/pairpulse.exe
          pairpulse/client/build/Release/*.dll
          pairpulse/client/*.bat
        if-no-files-found: warn
